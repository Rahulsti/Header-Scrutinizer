<!DOCTYPE html>
<html>
<head>
    <title>Header Scrutinizer</title>
    <style>
        body { width: 300px; font-family: sans-serif; padding: 10px; }
        h3 { margin-top: 0; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
        .score { font-size: 24px; font-weight: bold; }
        .pass { color: green; }
        .fail { color: red; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 5px; text-align: left; border-bottom: 1px solid #eee; font-size: 12px;}
    </style>
</head>
<body>
    <h3 id="hostname">Analyzing...</h3>
    <div style="text-align: center; margin-bottom: 10px;">
        <span id="security-score-display" class="score">--</span>% Security Score
    </div>
    <table>
        <thead>
            <tr>
                <th>Header</th>
                <th>Status</th>
                <th>Value (partial)</th>
            </tr>
        </thead>
        <tbody id="results-table-body">
            </tbody>
    </table>
    <script src="popup.js"></script>
</body>
</html>
